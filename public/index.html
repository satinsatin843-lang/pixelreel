<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelReel – Image & Video Creator</title>
<style>
:root{--bg:#0b0b14;--card:#151526;--tx:#f2f2f8;--mut:#9a9ab5;--ac:#7c5cff;--ac2:#ff5c9a;--bd:#2a2a44}
@media (prefers-color-scheme:light){:root{--bg:#f6f6fb;--card:#fff;--tx:#14142a;--mut:#62627f;--bd:#e0e0ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.w{max-width:560px;margin:auto;padding:0 16px 40px}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:16px 0}
h1{font-size:30px;line-height:1.2;margin:20px 0 6px}
.sub,.msg{color:var(--mut);font-size:14px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit;margin-bottom:10px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer}
.btn:disabled{opacity:.6}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:15px;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
img,video{width:100%;border-radius:12px;margin-top:12px;display:block}
a{color:var(--ac)}.hide{display:none}
.err{color:#ff5c6c;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="w">
<nav><span class="logo">✨ PixelReel</span><span class="pill hide" id="status"></span></nav>

<div id="authView">
<h1>Likho, aur image & video ban jaye</h1>
<p class="sub">3 din free. Uske baad sirf ₹20/month.</p>
<div class="card">
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password (kam se kam 6 akshar)">
<div class="err" id="authErr"></div>
<button class="btn" id="loginBtn">Login</button>
<p class="msg" style="text-align:center">Naye ho? <a href="#" id="signupBtn">Account banao (3 din free)</a></p>
</div>
</div>

<div id="appView" class="hide">
<div class="card">
<div class="tabs"><button class="tab on" data-m="image">🖼️ Image</button><button class="tab" data-m="video">🎬 Video</button></div>
<textarea id="prompt" rows="3" placeholder="Jaise: a lion on a mountain at sunset, cinematic"></textarea>
<div class="err" id="appErr"></div>
<button class="btn" id="go">Generate</button>
<div id="out"></div>
<p class="msg" id="hint">Tip: behtar result ke liye English mein likho.</p>
</div>
<div class="card" id="payCard" style="text-align:center">
<b>Pro Plan: ₹20/month</b>
<p class="sub">Trial ke baad bhi unlimited use.</p>
<button class="btn" id="payBtn">₹20 Pay karo</button>
</div>
<p class="msg" style="text-align:center"><a href="#" id="logout">Logout</a></p>
</div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var $=function(i){return document.getElementById(i)},mode='image',me=null;
function tok(){return localStorage.getItem('pr_token')}
function api(path,method,body){
  return fetch('/api/'+path,{method:method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tok()||'')},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'Kuch gadbad hui');e.code=r.status;throw e}return j})})
}
function show(loggedIn){$('authView').classList.toggle('hide',loggedIn);$('appView').classList.toggle('hide',!loggedIn);$('status').classList.toggle('hide',!loggedIn)}
function refresh(){
  return api('me').then(function(m){
    me=m;show(true);
    $('status').textContent=m.paid?'Pro ✓':m.active?'Free trial: '+m.trialDaysLeft+' din baki':'Trial khatam';
    $('payCard').classList.toggle('hide',m.paid);
  }).catch(function(){localStorage.removeItem('pr_token');show(false)})
}
function auth(kind){
  $('authErr').textContent='';
  api(kind,'POST',{email:$('email').value,password:$('pass').value})
  .then(function(j){localStorage.setItem('pr_token',j.token);return refresh()})
  .catch(function(e){$('authErr').textContent=e.message})
}
$('loginBtn').onclick=function(){auth('login')};
$('signupBtn').onclick=function(e){e.preventDefault();auth('signup')};
$('logout').onclick=function(e){e.preventDefault();localStorage.removeItem('pr_token');show(false)};
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');mode=b.dataset.m}});

$('go').onclick=function(){
  var p=$('prompt').value.trim();$('appErr').textContent='';
  if(!p){$('appErr').textContent='Pehle kuch likhein.';return}
  var btn=$('go');btn.disabled=true;btn.textContent='Ban raha hai…';$('out').innerHTML='';
  var done=function(){btn.disabled=false;btn.textContent='Generate'};
  if(mode==='image'){
    api('image','POST',{prompt:p}).then(function(j){$('out').innerHTML='<img src="'+j.image+'" alt="Generated image">';done()}).catch(fail)
  }else{
    api('video','POST',{prompt:p}).then(function(j){poll(j.id,0)}).catch(fail)
  }
  function poll(id,n){
    if(n>60){fail(new Error('Video mein der lag rahi hai, baad mein try karo'));return}
    api('video/'+id).then(function(j){
      if(j.status==='succeeded'&&j.url){var u=Array.isArray(j.url)?j.url[0]:j.url;$('out').innerHTML='<video src="'+u+'" controls autoplay loop playsinline></video><p class="msg"><a href="'+u+'" target="_blank" rel="noopener">Download / open</a></p>';done()}
      else if(j.status==='failed'||j.status==='canceled'){fail(new Error('Video nahi ban payi'))}
      else setTimeout(function(){poll(id,n+1)},4000)
    }).catch(fail)
  }
  function fail(e){$('appErr').textContent=e.message;done();if(e.code===402)refresh()}
};

$('payBtn').onclick=function(){
  api('pay/create','POST').then(function(o){
    new Razorpay({key:o.keyId,amount:o.amount,currency:'INR',order_id:o.orderId,name:'PixelReel',description:'Pro Plan – 1 month',
      handler:function(r){api('pay/verify','POST',r).then(refresh).catch(function(e){$('appErr').textContent=e.message})}
    }).open()
  }).catch(function(e){$('appErr').textContent=e.message})
};
if(tok())refresh();else show(false);
</script>
</body>
</html>
